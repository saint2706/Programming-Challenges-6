version: 2

# Every challenge under challenges/<Category>/<Challenge Name>/ is an independent project (its own
# manifest and lockfile, no shared workspace). The "directories" globs let Dependabot discover each
# one without listing ~90 entries by hand; folders without the manifest are skipped.
#
# Two settings cut the noise of that many projects:
#   groups    one PR per project per week for all minor/patch bumps, instead of one PR per package.
#             Majors stay separate so they get a human look. Security updates are never grouped.
#   cooldown  wait a week after a release before proposing it, which sidesteps the window in
#             which a compromised or yanked release is typically caught.
# Patch and minor PRs are auto-merged by dependabot-automerge.yml once "CI gate" passes.
updates:
  - package-ecosystem: "uv"
    directories:
      - "/challenges/*/*"
      - "/.github/ci-tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # Web Development Showcase demos (vanilla JS + vite/vitest/tsup) and the pinned dprint in
  # .github/ci-tools. None of these were covered before.
  - package-ecosystem: "npm"
    directories:
      - "/challenges/*/*"
      - "/.github/ci-tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # Rust challenges are standalone Cargo crates (own Cargo.toml + Cargo.lock).
  - package-ecosystem: "cargo"
    directories:
      - "/challenges/*/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
    # lapjv 0.3 (the Min Cost Flow oracle) is built on ndarray 0.16, so a 0.17 bump cannot compile
    # until lapjv ships a release for it. In 0.x semver, 0.16 -> 0.17 counts as a minor bump.
    ignore:
      - dependency-name: "ndarray"
        update-types: ["version-update:semver-minor"]
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # Keeps the SHA-pinned actions (and their "# vX.Y.Z" comments) in the workflows and in the
  # local composite action current.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(ci)"
