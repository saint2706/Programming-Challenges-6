name: CI

# One workflow for everything that has to pass before code is trusted. It replaces the separate
# Test Challenges and Rust Challenges workflows so there is a single `CI gate` check that is
# always reported, even when path filtering skips every language job (a skipped job cannot be
# marked required, which is why the gate exists).
#
# Pushes and PRs test only the challenge directories that changed. The weekly schedule (and a
# manual dispatch) runs everything, on the oldest and newest supported Python, so upstream drift
# is found on a quiet Sunday instead of inside an unrelated PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      directory:
        description: "Test only this challenge directory, e.g. 'challenges/Algorithmic Challenges/Josephus Problem Solver'"
        required: false
        type: string
      base:
        description: "Test only challenges changed relative to this ref (e.g. 'main'); empty tests everything"
        required: false
        type: string

permissions:
  contents: read

# Cancel superseded runs on PRs only. Every push to main gets its own group: a push is diffed
# against the previous tip, so cancelling (or replacing a pending) run would leave that commit's
# challenges untested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.python.outputs.dirs }}
      web: ${{ steps.web.outputs.dirs }}
      rust: ${{ steps.rust.outputs.dirs }}
      pythons: ${{ steps.pythons.outputs.versions }}
      coverage: ${{ steps.coverage.outputs.collect }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout (full history for diffing)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python challenges
        id: python
        uses: ./.github/actions/detect-changes
        with:
          manifest: pyproject.toml
          directory: ${{ inputs.directory }}
          base: ${{ inputs.base }}

      - name: Web challenges
        id: web
        uses: ./.github/actions/detect-changes
        with:
          manifest: package.json
          directory: ${{ inputs.directory }}
          base: ${{ inputs.base }}

      - name: Rust challenges
        id: rust
        uses: ./.github/actions/detect-changes
        with:
          manifest: Cargo.toml
          directory: ${{ inputs.directory }}
          base: ${{ inputs.base }}

      - name: Pick Python versions
        id: pythons
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          # requires-python is ">=3.12": PRs cover the floor, full runs add the newest release.
          if [ "$EVENT_NAME" = "schedule" ] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_BASE" ]; }; then
            echo 'versions=["3.12","3.14"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["3.12"]' >> "$GITHUB_OUTPUT"
          fi

      # Codecov numbers are only meaningful for pull requests (patch coverage) and for full runs
      # (the figure for main). A push to main tests just the changed challenges, so its partial
      # report would replace the full one. Dependabot pull requests are skipped: nobody reads them
      # and Dependabot runs get no OIDC token anyway.
      - name: Decide whether to collect coverage
        id: coverage
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_DIRECTORY: ${{ inputs.directory }}
        run: |
          collect=false
          if [ "$ACTOR" != "dependabot[bot]" ]; then
            if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "schedule" ]; then
              collect=true
            elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_BASE$INPUT_DIRECTORY" ]; then
              collect=true
            fi
          fi
          echo "collect=$collect" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint and format check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: .github/ci-tools/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/ci-tools/package-lock.json

      # ruff and dprint are pinned in .github/ci-tools (locked, Dependabot-managed), so CI,
      # the scheduled auto-fix and a local `uv run --project .github/ci-tools ruff` all agree.
      - name: Ruff lint
        run: uv run --project .github/ci-tools --locked ruff check --output-format=github .

      - name: Ruff format
        run: uv run --project .github/ci-tools --locked ruff format --check --diff .

      - name: dprint (markdown and JSON)
        run: |
          npm ci --prefix .github/ci-tools --ignore-scripts
          .github/ci-tools/node_modules/.bin/dprint check --config dprint.json

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.dir }}
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The newest Python is a canary, not a gate: a pinned dependency (paddlepaddle)
    # has no release for it yet. A red 3.14 leg is visible on the run but does not fail CI.
    continue-on-error: ${{ matrix.python == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.changes.outputs.python) }}
        python: ${{ fromJson(needs.changes.outputs.pythons) }}
    env:
      # The floor Python only: one report per challenge is enough.
      COLLECT_COVERAGE: ${{ needs.changes.outputs.coverage == 'true' && matrix.python == '3.12' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only pay for system packages the challenge actually declares. Their absence shows up as a
      # confusing pkg-config or cffi traceback rather than an obvious "apt-get install this".
      - name: Install system dependencies
        working-directory: ${{ matrix.dir }}
        run: |
          packages=""
          if grep -q '"manim' pyproject.toml; then
            # manimpango builds from source against pangocairo; ffmpeg is needed at render time.
            packages="$packages build-essential libcairo2-dev libpango1.0-dev ffmpeg pkg-config"
          fi
          if grep -q '"weasyprint' pyproject.toml; then
            # WeasyPrint loads Pango via cffi at import time; fonts make PDFs contain real text.
            packages="$packages libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core"
          fi
          if grep -q '"redis' pyproject.toml; then
            # The stream tests start their own redis-server on a free port; fakeredis alone cannot
            # run the separate-process and CLI tests.
            packages="$packages redis-server"
          fi
          if [ -n "$packages" ]; then
            sudo apt-get update
            # shellcheck disable=SC2086
            sudo apt-get install -y --no-install-recommends $packages
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          # The default glob hashes every uv.lock, so matrix jobs would race on one cache key.
          cache-dependency-glob: ${{ matrix.dir }}/uv.lock

      # --locked fails when uv.lock no longer matches pyproject.toml. A bare `uv run` would
      # silently re-resolve and pass with dependencies nobody reviewed.
      # A coverage run adds pytest-cov for this one command with --with, an overlay that leaves
      # uv.lock and the challenge's own dependencies alone. Both versions are pinned here by hand.
      - name: Run tests
        working-directory: ${{ matrix.dir }}
        run: |
          if [ "$COLLECT_COVERAGE" = true ]; then
            uv run --locked --with pytest-cov==7.1.0 --with coverage==7.16.2 pytest -q \
              --cov --cov-config="$GITHUB_WORKSPACE/.github/coveragerc" --cov-report=xml:coverage.xml
          else
            uv run --locked pytest -q
          fi

      # Best effort: a missing or odd report must not fail a challenge whose tests passed.
      - name: Prepare coverage report
        id: report
        if: env.COLLECT_COVERAGE == 'true'
        continue-on-error: true
        env:
          CHALLENGE_DIR: ${{ matrix.dir }}
          REPORT: ${{ runner.temp }}/coverage-${{ strategy.job-index }}.xml
        run: python3 .github/scripts/coverage_prefix.py "$CHALLENGE_DIR/coverage.xml" "$CHALLENGE_DIR" "$REPORT"

      # Best effort too, and it may replace an artifact: "Re-run all jobs" reuses the run, so the
      # names from the first attempt already exist, and a same-named upload fails without overwrite.
      # A storage hiccup must not fail a challenge whose tests passed either; `python` is in the gate.
      - name: Upload coverage report
        if: steps.report.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ runner.temp }}/coverage-${{ strategy.job-index }}.xml
          retention-days: 1
          overwrite: true

  web:
    name: Web / ${{ matrix.dir }}
    needs: changes
    if: needs.changes.outputs.web != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.changes.outputs.web) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Newer projects use pnpm (pnpm-lock.yaml); older ones still use npm (package-lock.json).
      - name: Detect package manager
        id: pm
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "name=pnpm" >> "$GITHUB_OUTPUT"
          else echo "name=npm" >> "$GITHUB_OUTPUT"; fi

      # Reads the version from the project's "packageManager" field.
      - name: Set up pnpm
        if: steps.pm.outputs.name == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ matrix.dir }}/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: ${{ steps.pm.outputs.name }}
          cache-dependency-path: ${{ matrix.dir }}/${{ steps.pm.outputs.name == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install
        working-directory: ${{ matrix.dir }}
        env:
          PM: ${{ steps.pm.outputs.name }}
        run: |
          if [ "$PM" = pnpm ]; then pnpm install --frozen-lockfile --ignore-scripts
          else npm ci --ignore-scripts; fi

      # Browser suites print PDFs and compare their text with the page. The runner image has no
      # CJK font, so Japanese glyphs would come out as missing-glyph boxes.
      - name: Install fonts for browser tests
        working-directory: ${{ matrix.dir }}
        run: |
          if jq -e '.scripts["test:e2e"]' package.json > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi

      - name: Unit tests
        working-directory: ${{ matrix.dir }}
        env:
          PM: ${{ steps.pm.outputs.name }}
        run: '"$PM" test'

      # Projects with a browser suite run it against the production build (the runner image ships
      # Google Chrome at /usr/bin/google-chrome, which the e2e helpers look for); the rest at
      # least have to build.
      - name: Build and end-to-end tests
        working-directory: ${{ matrix.dir }}
        env:
          PM: ${{ steps.pm.outputs.name }}
        run: |
          if jq -e '.scripts["test:e2e"]' package.json > /dev/null; then
            "$PM" run test:e2e
          elif jq -e '.scripts.build' package.json > /dev/null; then
            "$PM" run build
          fi

  rust:
    name: Rust / ${{ matrix.dir }}
    needs: changes
    if: needs.changes.outputs.rust != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.changes.outputs.rust) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ matrix.dir }}

      - name: Install nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo nextest run --release --locked
      - run: cargo test --doc --release --locked

  # One Codecov upload for all the per-challenge reports. It is its own job so that only this job
  # gets the OIDC token (id-token: write, no upload secret needed); the jobs that run challenge
  # code never see it. Deliberately not in the gate: a Codecov outage must not block a merge.
  coverage:
    name: Upload coverage
    needs: [changes, python]
    if: ${{ !cancelled() && needs.changes.outputs.coverage == 'true' && needs.python.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          directory: coverage
          fail_ci_if_error: false
          # The CLI's default plugins (xcode, gcov, pycoverage) scan the workspace. The downloaded
          # reports come from jobs that ran test code, so only upload them as they are.
          plugins: noop

  gate:
    name: CI gate
    needs: [changes, lint, python, web, rust]
    # always(): a skipped or failed dependency must still produce a verdict, not skip this job.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  notify:
    name: Report scheduled failure
    needs: gate
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the regression issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GATE_RESULT: ${{ needs.gate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ci-regression --description "Opened by the weekly full CI run" \
            --color "d73a4a" --force
          existing=$(gh issue list --label ci-regression --state open --json number --jq '.[0].number // empty')
          if [ "$GATE_RESULT" = "success" ]; then
            [ -z "$existing" ] || gh issue close "$existing" --comment "Weekly full run is green again: $RUN_URL"
            exit 0
          fi
          body="The weekly full CI run failed: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label ci-regression \
              --title "Weekly full CI run failed" --body "$body"
          fi
