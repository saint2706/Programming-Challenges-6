name: Dependency Review

# Flags newly introduced known-vulnerable or license-incompatible
# dependencies before merge. Only fires on pull_request (mainly Dependabot's
# own dependency-bump PRs, opened against the /challenges/*/* directories
# via .github/dependabot.yml's uv-ecosystem config).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: always
