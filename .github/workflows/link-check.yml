name: Markdown Link Check

# Two modes over the ~150 challenge READMEs and the root README's hand-maintained tracker:
#   pull_request    --offline: checks only that relative links and anchors resolve to files in
#                   the repo. Deterministic, fast, and fails the check, so a renamed or deleted
#                   challenge folder cannot leave dead tracker links behind.
#   schedule        also checks external reference links. Advisory only: it never fails the run,
#                   because some sites are flaky for bots. It keeps one tracking issue up to
#                   date and closes it again when everything resolves.
on:
  pull_request:
    branches: [main]
    paths: ["**/*.md", ".github/workflows/link-check.yml"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: markdown-link-check-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  link-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Remembers recent results so a flaky or slow host is not re-fetched on every run.
      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      - name: Check links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        env:
          # Authenticated GitHub requests avoid the anonymous rate limit on github.com links.
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Mail addresses are skipped by default: lychee 0.24 replaced --exclude-mail with an
          # opt-in --include-mail, and the stale flag once made lychee exit before checking a
          # single link, which this workflow misreported as "broken links found" (issue #5).
          # unsplash.com answers every automated request with 401, so it cannot be verified (#17).
          args: >-
            --no-progress
            --cache
            --max-cache-age 2d
            --exclude-path node_modules
            --exclude '^https://unsplash\.com/'
            --accept 100..=103,200..=299,403,429
            ${{ github.event_name == 'pull_request' && '--offline' || '--max-retries 3' }}
            './**/*.md'
          format: markdown
          output: ./lychee-report.md
          fail: ${{ github.event_name == 'pull_request' }}
          failIfEmpty: false

      - name: Open or update the broken-links issue
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create broken-links \
            --description "Opened by the scheduled Markdown Link Check workflow" \
            --color "d73a4a" --force
          existing=$(gh issue list --label broken-links --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            # Replace the body so the issue always shows the latest report, not 20 stacked ones.
            gh issue edit "$existing" --body-file lychee-report.md
          else
            gh issue create \
              --title "Scheduled link check found broken links" \
              --label broken-links \
              --body-file lychee-report.md
          fi

      - name: Close the broken-links issue once clean
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh issue list --label broken-links --state open --json number --jq '.[0].number // empty')
          [ -z "$existing" ] || gh issue close "$existing" --comment "All links resolve again."
