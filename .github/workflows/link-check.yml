name: Markdown Link Check

# Scheduled maintenance only, same pattern as lint-and-format.yml: never
# blocks a push/PR. Validates every relative link across the ~150 challenge
# READMEs (and the root README's hand-maintained master table) still
# resolves, plus external reference links in each challenge's "Sources"
# section. Opens/updates a single tracking issue on failure rather than
# failing the workflow outright, since some external sites are flaky for
# bot user agents and this is advisory, not a merge gate.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: markdown-link-check
  cancel-in-progress: false

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-mail
            --max-retries 3
            './**/*.md'
          format: markdown
          output: ./lychee-report.md
          fail: false
          failIfEmpty: false

      - name: Open or update an issue for broken links
        if: steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create broken-links \
            --description "Opened by the scheduled Markdown Link Check workflow" \
            --color "d73a4a" \
            --force

          existing=$(gh issue list --label broken-links --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file lychee-report.md
          else
            gh issue create \
              --title "Scheduled link check found broken links" \
              --label broken-links \
              --body-file lychee-report.md
          fi
