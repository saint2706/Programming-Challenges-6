# GitBook site Git Sync. The site is built from challenges/ (README.md is the landing page,
# SUMMARY.md the table of contents, generated by .github/scripts/gitbook_summary.py).
$schema: https://api.gitbook.com/gitbook-docs.yaml
version: 1
site:
  title: Programming Challenges 6
  structure:
    - type: space
      key: space-challenges
      title: Challenges
      path: challenges
      default: true
      content:
        directory: ./challenges
