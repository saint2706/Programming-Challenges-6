[project]
name = "customer-segmentation-explorer-rfm-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
    "streamlit>=1.65.0",
    "typer>=0.27.2",
]

[project.scripts]
rfm = "rfm_explorer.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
fetch = [
    "fastexcel>=0.19.0",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rfm_explorer"
