[project]
name = "automated-data-quality-monitor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "typer>=0.27.3",
]

[project.scripts]
data-quality = "data_quality.dq_monitor:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "data_quality"
