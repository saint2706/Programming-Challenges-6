[project]
name = "statistical-anomaly-detector-for-time-series"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
ts-anomaly = "ts_anomaly.anomaly_detector:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ts_anomaly"
