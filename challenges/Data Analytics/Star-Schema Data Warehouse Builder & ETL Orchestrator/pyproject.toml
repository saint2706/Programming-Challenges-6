[project]
name = "star-warehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.0",
    "polars>=2.0.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
warehouse = "star_warehouse.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
fetch = [
    "fastexcel>=0.19.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "star_warehouse"
