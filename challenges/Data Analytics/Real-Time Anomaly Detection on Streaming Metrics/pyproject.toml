[project]
name = "real-time-anomaly-detection-on-streaming-metrics"
version = "0.1.0"
description = "Online SPC charts (Shewhart + Western Electric rules, EWMA, CUSUM) on live metric streams."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.163.1",
    "numpy>=2.5.4",
]

[project.scripts]
spc-stream = "spc_stream.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spc_stream"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
