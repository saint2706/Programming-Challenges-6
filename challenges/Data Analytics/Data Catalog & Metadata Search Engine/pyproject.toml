[project]
name = "data-catalog-metadata-search-engine"
version = "0.1.0"
description = "Crawl SQLite, DuckDB and Parquet/CSV/JSON sources into a searchable metadata catalog."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi[standard]>=0.163.1",
]

[project.scripts]
catalog = "data_catalog.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "data_catalog"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
