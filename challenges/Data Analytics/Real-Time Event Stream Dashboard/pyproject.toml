[project]
name = "real-time-event-stream-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "redis>=7.0.0",
    "rich>=15.0.0",
    "streamlit>=1.65.0",
    "typer>=0.27.2",
]

[project.scripts]
stream-dash = "stream_dashboard.cli:app"

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.30.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stream_dashboard"
