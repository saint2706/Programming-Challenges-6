[project]
name = "geo-spatial-sales-heatmap-builder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "numpy>=2.5.3",
    "polars>=1.44.2",
]

[project.scripts]
sales-heatmap = "sales_heatmap.geo_heatmap:main"

[dependency-groups]
dev = [
    "jenkspy>=0.4.1",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
]
fetch = [
    "pyshp>=3.1.6",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sales_heatmap"
