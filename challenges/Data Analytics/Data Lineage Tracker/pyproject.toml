[project]
name = "data-lineage-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.0",
    "polars>=1.44.2",
    "rich>=15.0.0",
    "sqlglot>=30.0.0",
    "typer>=0.27.2",
]

[project.scripts]
lineage = "data_lineage.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
fetch = [
    "fastexcel>=0.19.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "data_lineage"
