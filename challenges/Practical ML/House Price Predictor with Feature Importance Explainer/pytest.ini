[pytest]
filterwarnings =
    # shap 0.4x's own colors module calls Colormap.set_bad/set_over/set_under
    # at import time, which matplotlib is deprecating in favor of
    # with_extremes(...). Nothing in this test suite triggers it directly;
    # it's an unfixed upstream shap/matplotlib version interaction.
    ignore:The set_(bad|over|under) function will be deprecated.*:PendingDeprecationWarning
