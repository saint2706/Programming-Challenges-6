[pytest]
filterwarnings =
    # shap's colors module calls Colormap.set_bad/set_over/set_under at
    # import time, which matplotlib is deprecating in favor of
    # with_extremes(...). Nothing in this test suite triggers it directly;
    # it's an unfixed upstream shap/matplotlib version interaction (same
    # one filtered in the House Price Predictor challenge).
    ignore:The set_(bad|over|under) function will be deprecated.*:PendingDeprecationWarning
    # shap.TreeExplainer's own informational note about its output-shape
    # change for LightGBM binary classifiers -- explain.py's
    # `_positive_class_shap_values` already normalizes every shape this
    # warning is about, so it fires but nothing here is affected by it.
    ignore:LightGBM binary classifier with TreeExplainer.*:UserWarning
