[project]
name = "image-background-remover"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "rembg[cpu]>=2.0.85",
    "typer>=0.27.2",
]

[project.scripts]
bg-remover = "bg_remover.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bg_remover"
