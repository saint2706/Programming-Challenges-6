[pytest]
filterwarnings =
    # huggingface_hub warns that Windows can't create symlinks in its cache
    # (needs Developer Mode/admin). Caching still works, just uses more disk --
    # an environment property, not something this code can or should fix.
    ignore:.*huggingface_hub. cache-system uses symlinks.*:UserWarning
    # one-time torch->OpenVINO conversion traces with fixed [B,256] shapes, so the
    # "trace might not generalize" notes do not apply (the shapes never change)
    ignore:.*torch.jit.trace_method.*:FutureWarning
    ignore:Converting a tensor to a Python boolean:torch.jit.TracerWarning
