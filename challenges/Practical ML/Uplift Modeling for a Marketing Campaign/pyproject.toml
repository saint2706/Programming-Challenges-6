[project]
name = "uplift-modeling"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.65.0",
    "typer>=0.27.3",
]

[project.scripts]
uplift = "uplift.cli:app"

[dependency-groups]
dev = [
    "causalml>=0.17.0",
    "pytest>=9.1.1",
    "scikit-uplift>=0.5.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "uplift"
