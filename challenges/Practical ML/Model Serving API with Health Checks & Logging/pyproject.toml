[project]
name = "model-serving-api-with-health-checks-logging"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
model-serving = "model_serving.app:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "model_serving"
