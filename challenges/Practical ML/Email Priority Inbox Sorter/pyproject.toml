[project]
name = "email-priority-inbox-sorter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "numpy>=2.3.5",
    "polars>=1.44.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.52.0",
    "streamlit>=1.64.0",
    "typer>=0.27.2",
]

[project.scripts]
inbox-sorter = "inbox_sorter.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "inbox_sorter"
