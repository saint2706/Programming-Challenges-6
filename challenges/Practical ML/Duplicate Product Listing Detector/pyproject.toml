[project]
name = "duplicate-product-listing-detector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kaggle>=2.2.4",
    "lancedb>=0.39.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "typer>=0.27.3",
]

[project.scripts]
duplicate-listings = "duplicate_listings.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "duplicate_listings"
