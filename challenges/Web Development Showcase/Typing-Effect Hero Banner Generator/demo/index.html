<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Typing Hero Banner — Demo</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --fg: #eef1f5;
        --accent: #7c9cff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 40rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        margin-bottom: 0.5rem;
      }
      .typing-hero {
        font-size: clamp(1.25rem, 3vw, 1.75rem);
        color: var(--accent);
        font-weight: 600;
        justify-content: center;
      }
      p.hint {
        margin-top: 2rem;
        opacity: 0.7;
        font-size: 0.9rem;
      }
      code {
        background: rgba(255, 255, 255, 0.08);
        padding: 0.1em 0.4em;
        border-radius: 0.3em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Typing Hero Banner</h1>
      <p id="hero"></p>
      <p class="hint">
        This demo imports the <strong>built</strong> package from
        <code>../dist/index.js</code> (real ESM output, run through <code>npm run build</code> first) — not the raw
        <code>src/</code> source — to prove the published bundle actually works standalone.
      </p>
    </main>

    <script type="module">
      import { createTypingHero } from '../dist/index.js';

      createTypingHero(document.getElementById('hero'), {
        strings: [
          'Data Storyteller & Analytics Strategist',
          'Building portfolio-worthy web experiences',
          'One character at a time.',
        ],
        typingSpeed: 55,
        deletingSpeed: 28,
        pauseBeforeDelete: 1400,
        startDelay: 300,
      }).start();
    </script>
  </body>
</html>
