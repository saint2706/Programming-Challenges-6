<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- No network at all: no fetch, no images or scripts from elsewhere. Inline scripts and handlers never run;
         the person's code arrives as a blob: module that the playground has already guarded. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; worker-src blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>Preview</title>
    <script src="sandbox-format.js"></script>
    <script src="sandbox.js"></script>
</head>
<body></body>
</html>
