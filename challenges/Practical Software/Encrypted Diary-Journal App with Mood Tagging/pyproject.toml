[project]
name = "encrypted-diary-journal-app-with-mood-tagging"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "textual>=8.2.8",
]

[project.scripts]
encrypted-diary = "encrypted_diary.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "encrypted_diary"
