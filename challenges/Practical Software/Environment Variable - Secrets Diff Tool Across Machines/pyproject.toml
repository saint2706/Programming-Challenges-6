[project]
name = "environment-variable-secrets-diff-tool-across-machines"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
envdiff = "envdiff.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "envdiff"
