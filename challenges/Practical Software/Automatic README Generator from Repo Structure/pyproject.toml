[project]
name = "automatic-readme-generator-from-repo-structure"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pathspec>=1.1.1",
    "typer>=0.27.2",
]

[project.scripts]
readme-gen = "readme_generator.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "readme_generator"
