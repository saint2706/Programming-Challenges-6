[project]
name = "multi-timezone-meeting-scheduler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
meeting-scheduler = "meeting_scheduler.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "meeting_scheduler"
