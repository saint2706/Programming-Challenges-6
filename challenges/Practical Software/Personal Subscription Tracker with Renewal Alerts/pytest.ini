[pytest]
filterwarnings =
    # Starlette 1.6.0's testclient.py itself references the deprecated
    # anyio.abc.BlockingPortal alias at import time (before any of our code
    # runs), against anyio >= 4.15. Nothing in this test suite triggers it;
    # it's an unfixed upstream Starlette/anyio version interaction.
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning
