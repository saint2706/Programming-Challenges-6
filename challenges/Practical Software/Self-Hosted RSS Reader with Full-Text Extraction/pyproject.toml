[project]
name = "self-hosted-rss-reader-with-full-text-extraction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "trafilatura>=2.2.0",
    "typer>=0.27.2",
]

[project.scripts]
rss-reader = "rss_reader.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rss_reader"
