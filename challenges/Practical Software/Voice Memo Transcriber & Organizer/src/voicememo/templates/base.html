<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Voice memos{% endblock %} | Voice Memo Library</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Voice memos</a>
  <form class="search" method="get" action="/" role="search">
    <input type="search" name="q" value="{{ q or '' }}" placeholder="Search transcripts" maxlength="200" aria-label="Search transcripts">
    <button type="submit">Search</button>
  </form>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
