[project]
name = "receipt-ocr-expense-categorizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pillow>=12.3.0",
    "rapidfuzz>=3.14.6",
    "typer>=0.27.2",
]

[project.scripts]
receipt-ocr = "receipt_ocr.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "receipt_ocr"
