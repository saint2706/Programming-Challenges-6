[project]
name = "automatic-invoice-generator-pdf-emailer-for-freelancers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "babel>=2.18.0",
    "cyclopts>=5.2.0",
    "factur-x>=7.6",
    "jinja2>=3.1.6",
    "litestar>=2.24.0",
    "pypdf>=6.20.1",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
    "weasyprint>=70.0",
]

[project.scripts]
invoicer = "invoicer.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "invoicer"

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "pypdfium2>=5.14.0",
    "pytest>=9.1.1",
]
