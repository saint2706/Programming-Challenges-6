{% extends "web/base.html" %}
{% block title %}Clients{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Clients</h1>
</div>
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Email</th>
        <th scope="col">Country</th>
        <th scope="col">Currency</th>
        <th scope="col" class="num">Terms (days)</th>
      </tr>
    </thead>
    <tbody>
      {% for c in clients %}
      <tr>
        <td>{{ c.name }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.country }}</td>
        <td>{{ c.currency }}</td>
        <td class="num">{{ c.terms_days }}</td>
      </tr>
      {% else %}
      <tr><td colspan="5" class="empty">No clients yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
