[project]
name = "gitaudit"
version = "0.1.0"
description = "Git repository health auditor: stale branches, oversized blobs, leaked secrets, hygiene."
requires-python = ">=3.12"
dependencies = [
    "rich>=14.0.0",
]

[project.scripts]
gitaudit = "gitaudit.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gitaudit"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]
