[package]
name = "merkle_tree"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
rayon = "1.12.0"
sha2 = "0.11.0"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"

[[bench]]
name = "merkle"
harness = false

[[bin]]
name = "merkle"
path = "src/bin/merkle.rs"
