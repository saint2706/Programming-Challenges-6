[package]
name = "link-cut-tree"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Dynamic forests: a splay link-cut tree vs an Euler tour tree and a UFO tree, plus offline dynamic connectivity."

[lib]
name = "lct"
path = "src/lib.rs"

[[bin]]
name = "lct"
path = "src/bin/lct.rs"

[[bench]]
name = "forest"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
foldhash = "0.2.0"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"
